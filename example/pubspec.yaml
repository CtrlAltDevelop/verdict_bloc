name: verdict_bloc_example
description: Demonstrates verdict_bloc's state, feedback delegate and list bloc.
publish_to: "none"
version: 1.0.0

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  verdict: 1.0.0
  verdict_bloc:
    path: ../

  material_ui: 1.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

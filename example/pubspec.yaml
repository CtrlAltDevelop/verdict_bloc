name: verdict_bloc_example
description: Demonstrates verdict_bloc's state, feedback delegate and list bloc.
publish_to: "none"
version: 1.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ">=8.1.0 <10.0.0"
  verdict: ">=1.1.0 <2.0.0"
  verdict_bloc:
    path: ../

dev_dependencies:
  flutter_lints: ">=3.0.0 <7.0.0"
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

name: verdict_bloc
description: BLoC states that keep the last known good data through error and loading, plus a paginated list bloc, built on verdict's Result and Failure.
version: 2.0.1
homepage: https://github.com/CtrlAltDevelop
repository: https://github.com/CtrlAltDevelop/verdict_bloc
issue_tracker: https://github.com/CtrlAltDevelop/verdict_bloc/issues

topics:
  - bloc
  - state-management
  - error-handling
  - pagination
  - result

# The floor is Dart 3.12 — Flutter 3.44.0 — the SDK every package here is
# gated on. The code needs only Dart 3.0: sealed classes, class modifiers and
# pattern matching, and nothing newer.
environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  equatable: ">=3.0.0 <4.0.0"
  flutter_bloc: ">=9.0.0 <10.0.0"
  verdict: ">=2.0.0 <3.0.0"

dev_dependencies:
  bloc_test: ">=10.0.0 <11.0.0"
  flutter_lints: ">=6.0.0 <7.0.0"
  flutter_test:
    sdk: flutter
